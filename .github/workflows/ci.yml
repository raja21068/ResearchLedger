name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install researchledger (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check researchledger/ tests/

      - name: Type check (mypy)
        run: python -m mypy researchledger/

      - name: Unit + integration tests, with coverage
        run: python -m pytest tests/ --cov=researchledger --cov-report=term-missing -v

      - name: CLI smoke test
        shell: bash
        run: |
          set -e
          mkdir smoke-workspace && cd smoke-workspace
          researchledger init
          researchledger run -- python -c "print('ok')"
          researchledger validate --strict
          researchledger report

      - name: Shipped example validates clean
        shell: bash
        run: |
          set -e
          cd examples/quickstart
          researchledger validate --strict
          researchledger validate-paper papers/main/paper.md

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install researchledger and pip-audit
        run: python -m pip install -e . pip-audit
      - name: Audit researchledger's own dependencies
        run: python -m pip_audit --requirement <(python -m pip freeze | grep -Ei '^(pyyaml|jsonschema)==')
