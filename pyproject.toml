[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchledger"
version = "2.0.0"
description = "Immutable run ledger, deterministic validator and claim-to-artifact tracing for ResearchLedger (ConvFusion) research workspaces."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "waqar", email = "waqar.uestc@yahoo.com" }]
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
researchledger = "researchledger.cli:main"

[tool.setuptools.packages.find]
include = ["researchledger*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
