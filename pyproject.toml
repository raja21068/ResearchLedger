[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperfactory-researchledger"
version = "2.0.1"
description = "Evidence-first research pipeline with protocol, claim, literature and isolated-repeat gates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4", "matplotlib>=3.7", "PyYAML>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
researchctl = "factory.cli.main:main"
researchledger = "researchledger.cli:main"

[tool.setuptools.packages.find]
include = ["factory*", "researchledger*"]

[tool.setuptools.package-data]
"factory.steps" = ["review_assets/*.json", "review_assets/*.md", "review_assets/*.txt", "review_assets/REFEREE_LICENSE"]
