<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="260" viewBox="0 0 1500 260" role="img" aria-labelledby="t d">
<title id="t">Validation gates</title><desc id="d">Six validation checks from protocol lock to scientific integrity audit.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#8296A7" stroke-width="1.3"/></marker>
<style>.t{font:700 16px Inter,Segoe UI,Arial;fill:#263F52}.s{font:500 13px Inter,Segoe UI,Arial;fill:#63788A}.n{font:700 13px Inter,Segoe UI,Arial;fill:#fff}</style></defs>
<rect width="1500" height="260" rx="18" fill="#FBFCFD"/>
<g fill="none" stroke="#8296A7" stroke-width="2" marker-end="url(#a)">
<path d="M225 125 H265"/><path d="M465 125 H505"/><path d="M705 125 H745"/><path d="M945 125 H985"/><path d="M1185 125 H1225"/>
</g>
<g>
<rect x="35" y="65" width="190" height="120" rx="12" fill="#EAF1F7" stroke="#B8CBD9"/><circle cx="60" cy="48" r="14" fill="#477A9E"/><text x="60" y="53" text-anchor="middle" class="n">1</text><text x="130" y="111" text-anchor="middle" class="t">Protocol lock</text><text x="130" y="139" text-anchor="middle" class="s">Prospective plan</text>
<rect x="275" y="65" width="190" height="120" rx="12" fill="#E8F2F0" stroke="#B9D3CE"/><circle cx="300" cy="48" r="14" fill="#4B8D87"/><text x="300" y="53" text-anchor="middle" class="n">2</text><text x="370" y="111" text-anchor="middle" class="t">Literature check</text><text x="370" y="139" text-anchor="middle" class="s">DOI metadata</text>
<rect x="515" y="65" width="190" height="120" rx="12" fill="#F0ECF5" stroke="#CFC3DD"/><circle cx="540" cy="48" r="14" fill="#8E7BA8"/><text x="540" y="53" text-anchor="middle" class="n">3</text><text x="610" y="111" text-anchor="middle" class="t">Experiment receipt</text><text x="610" y="139" text-anchor="middle" class="s">Run + digests</text>
<rect x="755" y="65" width="190" height="120" rx="12" fill="#F6F0E7" stroke="#E0CFB5"/><circle cx="780" cy="48" r="14" fill="#B58A50"/><text x="780" y="53" text-anchor="middle" class="n">4</text><text x="850" y="111" text-anchor="middle" class="t">Claim mapping</text><text x="850" y="139" text-anchor="middle" class="s">Claim ↔ evidence</text>
<rect x="995" y="65" width="190" height="120" rx="12" fill="#E8F2F0" stroke="#B9D3CE"/><circle cx="1020" cy="48" r="14" fill="#4B8D87"/><text x="1020" y="53" text-anchor="middle" class="n">5</text><text x="1090" y="111" text-anchor="middle" class="t">Isolated repeat</text><text x="1090" y="139" text-anchor="middle" class="s">Same implementation</text>
<rect x="1235" y="65" width="230" height="120" rx="12" fill="#EAF1F7" stroke="#B8CBD9"/><circle cx="1260" cy="48" r="14" fill="#477A9E"/><text x="1260" y="53" text-anchor="middle" class="n">6</text><text x="1350" y="111" text-anchor="middle" class="t">Integrity audit</text><text x="1350" y="139" text-anchor="middle" class="s">Machine-checkable gates</text>
