<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-labelledby="t d">
<title id="t">ResearchLedger system architecture</title>
<desc id="d">Paper Factory coordinates five research stages above a cross-cutting ResearchLedger evidence layer.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#73889A" stroke-width="1.3"/></marker>
  <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#8DA4B7"/></marker>
  <style>
    .h{font:700 27px Inter,Segoe UI,Arial;fill:#20384A}
    .sub{font:500 17px Inter,Segoe UI,Arial;fill:#607487}
    .stage{font:700 19px Inter,Segoe UI,Arial;fill:#20384A}
    .small{font:500 15px Inter,Segoe UI,Arial;fill:#607487}
    .tag{font:700 14px Inter,Segoe UI,Arial;letter-spacing:1px;fill:#4B8D87}
    .node{font:700 17px Inter,Segoe UI,Arial;fill:#263F52}
    .desc{font:500 14px Inter,Segoe UI,Arial;fill:#63788A}
  </style>
</defs>
<rect width="1500" height="790" rx="22" fill="#FBFCFD"/>
<text x="70" y="65" class="tag">SYSTEM OVERVIEW</text>
<text x="70" y="105" class="h">Two layers. One traceable research workflow.</text>
<text x="70" y="137" class="sub">Production agents create research artifacts; the evidence layer records how those artifacts were produced.</text>

<rect x="70" y="175" width="1360" height="285" rx="18" fill="#F4F7FA" stroke="#CFDCE6" stroke-width="2"/>
<text x="100" y="215" class="tag">RESEARCH PRODUCTION</text>
<text x="100" y="245" class="h">Paper Factory</text>
<text x="100" y="273" class="sub">Orchestrates the research lifecycle</text>

<g>
  <rect x="100" y="310" width="220" height="105" rx="12" fill="#EAF1F7" stroke="#AFC5D7" stroke-width="1.5"/>
  <text x="120" y="344" class="tag">S1</text><text x="120" y="375" class="stage">Idea selection</text><text x="120" y="399" class="small">Hypotheses · falsifiability</text>
  <rect x="365" y="310" width="220" height="105" rx="12" fill="#E8F2F0" stroke="#B5D4CF" stroke-width="1.5"/>
  <text x="385" y="344" class="tag">S2</text><text x="385" y="375" class="stage">Drafting</text><text x="385" y="399" class="small">LaTeX · empty result slots</text>
  <rect x="630" y="310" width="220" height="105" rx="12" fill="#F0ECF5" stroke="#CFC3DD" stroke-width="1.5"/>
  <text x="650" y="344" class="tag">S3</text><text x="650" y="375" class="stage">Peer review</text><text x="650" y="399" class="small">Critique · concern tracking</text>
  <rect x="895" y="310" width="220" height="105" rx="12" fill="#F6F0E7" stroke="#E0CFB5" stroke-width="1.5"/>
  <text x="915" y="344" class="tag">S4</text><text x="915" y="375" class="stage">Execution</text><text x="915" y="399" class="small">Sandbox · measured outputs</text>
  <rect x="1160" y="310" width="220" height="105" rx="12" fill="#EAF1F7" stroke="#AFC5D7" stroke-width="1.5"/>
  <text x="1180" y="344" class="tag">S5</text><text x="1180" y="375" class="stage">Revision</text><text x="1180" y="399" class="small">Evidence-bound updates</text>
  <g fill="none" stroke="#73889A" stroke-width="2" marker-end="url(#arrow)">
    <path d="M320 362 H355"/><path d="M585 362 H620"/><path d="M850 362 H885"/><path d="M1115 362 H1150"/>
  </g>
</g>

<path d="M210 460 V505 M475 460 V505 M740 460 V505 M1005 460 V505 M1270 460 V505" stroke="#8DA4B7" stroke-width="1.8" stroke-dasharray="6 7" fill="none"/>
<rect x="70" y="505" width="1360" height="220" rx="18" fill="#F2F7F6" stroke="#BFD6D1" stroke-width="2"/>
<text x="100" y="548" class="tag">SCIENTIFIC EVIDENCE LAYER</text>
<text x="100" y="578" class="h">ResearchLedger</text>
<text x="100" y="606" class="sub">Persistent provenance across the lifecycle</text>
<g>
  <rect x="100" y="635" width="165" height="58" rx="10" fill="#FFFFFF" stroke="#B9D1CC"/><text x="182" y="660" class="node" text-anchor="middle">Hypotheses</text><text x="182" y="681" class="desc" text-anchor="middle">research ideas</text>
  <rect x="285" y="635" width="165" height="58" rx="10" fill="#FFFFFF" stroke="#B9D1CC"/><text x="367" y="660" class="node" text-anchor="middle">Protocols</text><text x="367" y="681" class="desc" text-anchor="middle">locked plans</text>
  <rect x="470" y="635" width="165" height="58" rx="10" fill="#FFFFFF" stroke="#B9D1CC"/><text x="552" y="660" class="node" text-anchor="middle">Datasets</text><text x="552" y="681" class="desc" text-anchor="middle">digests · versions</text>
  <rect x="655" y="635" width="165" height="58" rx="10" fill="#FFFFFF" stroke="#B9D1CC"/><text x="737" y="660" class="node" text-anchor="middle">Runs</text><text x="737" y="681" class="desc" text-anchor="middle">R####</text>
  <rect x="840" y="635" width="165" height="58" rx="10" fill="#FFFFFF" stroke="#B9D1CC"/><text x="922" y="660" class="node" text-anchor="middle">Evidence</text><text x="922" y="681" class="desc" text-anchor="middle">E###</text>
  <rect x="1025" y="635" width="165" height="58" rx="10" fill="#FFFFFF" stroke="#B9D1CC"/><text x="1107" y="660" class="node" text-anchor="middle">Claims</text><text x="1107" y="681" class="desc" text-anchor="middle">C###</text>
  <rect x="1210" y="635" width="165" height="58" rx="10" fill="#FFFFFF" stroke="#B9D1CC"/><text x="1292" y="660" class="node" text-anchor="middle">Audits</text><text x="1292" y="681" class="desc" text-anchor="middle">integrity checks</text>
  <g fill="none" stroke="#7B9F98" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M265 664 H278"/><path d="M450 664 H463"/><path d="M635 664 H648"/><path d="M820 664 H833"/><path d="M1005 664 H1018"/><path d="M1190 664 H1203"/>
  </g>
</g>
</svg>